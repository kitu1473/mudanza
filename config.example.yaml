# Config de ejemplo. Copiar a config.yaml (ignorado por git) para uso local.
# En GitHub Actions se usa este mismo archivo; el token y el chat id llegan
# por los secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (nunca van acá).
persist: false
dry_run: true          # true = no manda a Telegram ni marca avisos como enviados
db_path: scrapdep.db
pages: 3               # 15-20 para la primera corrida; 2-3 después
mercadolibre_pages: 5  # MercadoLibre sin orden por fecha: más páginas (4-5)
geocode: true          # dirección -> coordenadas (Nominatim/OpenStreetMap, gratis)
geocode_limit: 40      # máx. avisos a geocodificar por corrida
map_output: mapa.html
map_max_age_days: 14   # avisos no vistos hace más días salen del mapa
discarded_file: descartados.txt  # URLs a ocultar del mapa, una por línea
request_delay: 1.5     # segundos entre requests, para no ser bloqueado
# bot_token: ""        # o variable de entorno TELEGRAM_BOT_TOKEN
# chat_room: ""        # o variable de entorno TELEGRAM_CHAT_ID


